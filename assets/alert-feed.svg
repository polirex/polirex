<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img">
  <title>alert feed: five alerts about Kim, severity INFO through CRITICAL</title>

  <!-- window -->
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#0f1a2b" stroke="#ff6b5c" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="16" y1="52" x2="744" y2="52" stroke="#3a4a63" stroke-opacity="0.8" stroke-width="1"/>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace">

    <!-- title bar -->
    <text x="28" y="33" font-size="14" letter-spacing="1.2" fill="#8a9bb3">kim.kato / alert feed</text>

    <!-- live indicator -->
    <circle cx="704" cy="28" r="4.5" fill="#ff6b5c">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="704" cy="28" r="4.5" fill="none" stroke="#ff6b5c" stroke-width="1.5">
      <animate attributeName="r" values="4.5;11" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="718" y="33" font-size="13" letter-spacing="1.5" fill="#ff6b5c">live</text>

    <!-- column header -->
    <text x="28" y="80" font-size="11" letter-spacing="1.5" fill="#3a4a63">TIME</text>
    <text x="138" y="80" font-size="11" letter-spacing="1.5" text-anchor="middle" fill="#3a4a63">SEVERITY</text>
    <text x="198" y="80" font-size="11" letter-spacing="1.5" fill="#3a4a63">MESSAGE</text>

    <!-- row 1: INFO -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4286;1" begin="0s" dur="0.7s" fill="freeze"/>
      <text x="28" y="121" font-size="13" fill="#3a4a63">-12m</text>
      <rect x="100" y="106" width="76" height="22" rx="5" fill="#3a4a63" fill-opacity="0.45"/>
      <text x="138" y="121" font-size="11.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#8a9bb3">INFO</text>
      <text x="198" y="121" font-size="16" fill="#f3ede4">Security engineer · Texas</text>
    </g>

    <!-- row 2: LOW -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6923;1" begin="0s" dur="1.3s" fill="freeze"/>
      <text x="28" y="171" font-size="13" fill="#3a4a63">-8m</text>
      <rect x="100" y="156" width="76" height="22" rx="5" fill="#f5b342" fill-opacity="0.18"/>
      <text x="138" y="171" font-size="11.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#f5b342">LOW</text>
      <text x="198" y="171" font-size="16" fill="#f3ede4">Caffeine above baseline</text>
    </g>

    <!-- row 3: MEDIUM -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7895;1" begin="0s" dur="1.9s" fill="freeze"/>
      <text x="28" y="221" font-size="13" fill="#3a4a63">-5m</text>
      <rect x="100" y="206" width="76" height="22" rx="5" fill="#f5b342"/>
      <text x="138" y="221" font-size="11.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#0f1a2b">MEDIUM</text>
      <text x="198" y="221" font-size="16" fill="#f3ede4">Reads the whole diff. Yes, that file too.</text>
    </g>

    <!-- row 4: HIGH -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.84;1" begin="0s" dur="2.5s" fill="freeze"/>
      <text x="28" y="271" font-size="13" fill="#3a4a63">-2m</text>
      <rect x="100" y="256" width="76" height="22" rx="5" fill="#ff6b5c" fill-opacity="0.2"/>
      <text x="138" y="271" font-size="11.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#ff6b5c">HIGH</text>
      <text x="198" y="271" font-size="16" fill="#f3ede4">Builds the guardrails, not just the reviews</text>
    </g>

    <!-- row 5: CRITICAL -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.875;1" begin="0s" dur="3.2s" fill="freeze"/>
      <text x="28" y="321" font-size="13" fill="#3a4a63">now</text>
      <rect x="100" y="306" width="76" height="22" rx="5" fill="#ff6b5c"/>
      <text x="138" y="321" font-size="11.5" font-weight="700" letter-spacing="1.2" text-anchor="middle" fill="#0f1a2b">CRITICAL</text>
      <text x="198" y="321" font-size="16" fill="#f3ede4">Wants to talk about agent security</text>
    </g>

    <!-- footer -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.875;1" begin="0s" dur="4.0s" fill="freeze"/>
      <text x="28" y="370" font-size="12" letter-spacing="1" fill="#3a4a63">5 alerts · 0 false positives · waiting for new events</text>
      <rect x="478" y="359" width="8" height="14" fill="#f5b342">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
